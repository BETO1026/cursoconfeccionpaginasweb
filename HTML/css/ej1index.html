<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <title>Tarjeta de presentacion</title>
    <style>
        body {

            height: 100vh;
            background: linear-gradient(0deg, rgba(34, 193, 195, 1) 0%, rgba(253, 187, 45, 1) 100%);
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
        }
        .card {
            background-color: rgb(121, 199, 199);
            text-align: center;
            border: 10px #FDBB2D;
            padding: 50px;
            margin-top: 50px;
            margin-bottom: 200px;
            margin-left: 500px;
            margin-right: 500px;
            border-radius: 20px;
            box-shadow: 25px 31px 38px -4px rgba(0, 0, 0, 0.75);
            -webkit-box-shadow: 25px 31px 38px -4px rgba(0, 0, 0, 0.75);
            -moz-box-shadow: 25px 31px 38px -4px rgba(0, 0, 0, 0.75);
            font-family: cursive;
        }
        h2 {
            color: #bb9648;
        }
        p {
            margin-bottom: 30px;
        }
        .btn {
            background-color: rgb(235, 183, 70);
           border-radius: 100%;
        }
        .btn:hover {
            background-color: rgb(38, 197, 218);
        }
        a {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: none;
            padding: 20px 25px;
            color: rgb(5, 97, 97);
            font-weight: 800;
        }
        img {
            max-width: 500px;
            border-radius: 30%;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="avatar.png" alt="avatar">
        <h2>OSCAR ALBERTO PEREZ CANTOR</h2>
        <a href="http//facebook.es"></a>
        <P>Soy una persona proactiva, demasiado entusiasta con una visiòn del mundo ambiciosa, sueños y metas que no
            podrìa explicar en un solo dia; extremadamente curioso, nomada y emotivo </P>
        <button class="btn"><a href="http//facebook.es">Mi sitio web</a></button>
    </div>
</body>
</html>
