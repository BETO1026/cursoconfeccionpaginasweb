<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call to Action</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<style>body {
  margin: 0;
  font-family: Arial, sans-serif;
}

.cta-container {
  background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9IawrXXkuJZqBATTG9KKZXsDSfo0f0Ou-Sg&s'); /* Reemplaza con tu imagen */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  text-align: center;
  padding: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
}

.cta-text {
  margin: 0 0 20px 0;
}

.cta-text h2,
.cta-container h2 {
  font-size: 28px;
  font-weight: bold;
}

.cta-button {
  background-color: #626bb2;
  color: white;
  padding: 15px 30px;
  border: none;
  border-radius: 8px;
  font-size: 20px;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.cta-button:hover {
  background-color: #4f5895;
}

</style>
  <div class="cta-container">
    <h2 class="cta-text">¡Aprovecha nuestra oferta especial!</h2>
    <p class="cta-text">Hasta un 40% de descuento en productos seleccionados.</p>
    <button class="cta-button">Descubrir Ofertas</button>
  </div>
  


</body>
</html>
